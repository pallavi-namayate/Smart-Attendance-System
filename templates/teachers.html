<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FRAMS — Teachers</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body { background: #f7f9fb; }
    .card { margin-top: 40px; padding: 25px; background: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h3 { margin-bottom: 20px; }
    ul { padding-left: 20px; }
    li { padding: 5px 0; font-size: 16px; }
  </style>
</head>
<body>
<div class="container">
  <div class="col-md-8 col-md-offset-2 card">
    <h3>Registered Teachers</h3>
    <ul>
      {% for n in names %}
        <li><span class="glyphicon glyphicon-user"></span> {{ n }}</li>
      {% endfor %}
    </ul>
    <hr>
    <a href="/teacher_attendance" class="btn btn-info">View Today's Teacher Attendance</a>
    <a href="/" class="btn btn-default">Back</a>
  </div>
</div>
</body>
</html>
