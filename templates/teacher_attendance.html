<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FRAMS — Teacher Attendance</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body { background: #f7f9fb; }
    .card { margin-top: 40px; padding: 25px; background: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h3 { margin-bottom: 20px; }
    table { background: #fff; }
  </style>
</head>
<body>
<div class="container" style="margin-top:30px;">
  <div class="col-md-10 col-md-offset-1 card">
    <h3>Today's Teacher Attendance</h3>
    <table class="table table-striped table-bordered">
      <thead>
        <tr><th>Name</th><th>Time</th><th>Date</th></tr>
      </thead>
      <tbody>
        {% for r in rows %}
          <tr>
            <td>{{ r['NAME'] }}</td>
            <td>{{ r['Time'] }}</td>
            <td>{{ r['Date'] }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="text-center text-muted">No teacher attendance recorded for today.</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="/new" class="btn btn-default">Back</a>
  </div>
</div>
</body>
</html>
