<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>FRAMS — Teacher Captured</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body {
      background: #f7f9fb;
    }

    .card {
      margin-top: 60px;
      padding: 25px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h3 {
      margin-bottom: 25px;
    }

    .btn {
      margin: 5px;
    }
  </style>
</head>

<body>
  <div class="container" style="margin-top:40px;">
  <div class="panel panel-success">
    <div class="panel-heading"><strong>Teacher Image Saved</strong></div>
    <div class="panel-body">
      <p>Saved image for <strong>{{ name }}</strong>.</p>
      {% if file %}
        <p>File: {{ file }}</p>
      {% endif %}
      <a href="/teacher_register" class="btn btn-default">Register another</a>
      <a href="/teacher_attendance" class="btn btn-primary">View Teacher Attendance</a>
    </div>
  </div>
</div>
</body>

</html>
