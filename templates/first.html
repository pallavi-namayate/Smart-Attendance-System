<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Attendance — FRAMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 3 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f3f6f9;
    }

    /* background image layer (keeps previous code idea) */
    #page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
      box-sizing: border-box;
    }
    #page::before {
      content: "";
      position: absolute;
      inset: 0; /* top:0;right:0;bottom:0;left:0 */
      background: url("{{ url_for('static', filename='bg-test9.jpg') }}") no-repeat center center/cover;
      opacity: 0.12;
      z-index: 0;
      filter: blur(0px);
    }

    /* card */
    .result-card {
      position: relative;
      z-index: 1;
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(19, 35, 47, 0.12);
      padding: 36px;
      text-align: center;
    }

    .success-icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: #fff;
      font-size: 44px;
      box-shadow: 0 6px 18px rgba(32, 201, 151, 0.18);
      margin-bottom: 18px;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 6px;
      color: #1f2933;
      font-weight: 600;
    }

    p.lead {
      color: #586069;
      margin-bottom: 22px;
      font-size: 15px;
    }

    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 6px;
    }
    .btn-default {
      padding: 12px 18px;
      font-size: 15px;
      border-radius: 6px;
      margin-left: 10px;
    }

    @media (max-width: 480px) {
      .result-card { padding: 22px; }
      .success-icon { width: 78px; height: 78px; font-size:36px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <section id="page">
    <div class="result-card">
      <div class="success-icon">
        <!-- check mark -->
        <span class="glyphicon glyphicon-ok"></span>
      </div>

      <h1>Attendance marked successfully!</h1>
      <p class="lead">Attendance has been recorded. Thank you — you can return to the main page or view the attendance records.</p>

      <div style="margin-top:18px;">
        <form action="/" method="GET" style="display:inline-block; margin:0;">
          <button class="btn btn-primary" type="submit">
            <span class="glyphicon glyphicon-home" aria-hidden="true"></span>
            &nbsp; Go to Main Page
          </button>
        </form>

        <!-- optional secondary action; remove or change as needed -->
        <a href="/whole" class="btn btn-default" role="button">
          <span class="glyphicon glyphicon-list-alt" aria-hidden="true"></span>
          &nbsp; View Attendance
        </a>
      </div>
    </div>
  </section>
</body>
</html>
